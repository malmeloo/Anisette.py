[project]
name = "Anisette"
version = "1.2.4"
description = "Anisette provider"
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.28.1",
    "pyelftools>=0.33",
    "typing-extensions>=4.12.2,<5.0.0",
    "unicorn>=2.1.1,<3.0.0",
    "websockets>=16.0",
    # these deps are technically optional, but we want to make sure they are installed for the CLI to work properly
    # we can put them in an extra once PEP 771 is implemented: https://peps.python.org/pep-0771/
    "typer>=0.15.1",
    "rich>=15.0.0",
    "fastapi>=0.138.0",
    "granian>=2.7.6",
]

[project.scripts]
ani = "anisette.cli:app"
anisette = "anisette.cli:app"

[dependency-groups]
dev = [
    "basedpyright>=1.31.4",
    "furo>=2025.7.19",
    "myst-parser>=4.0.1; python_version >= '3.10'",
    "packaging>=26.2",
    "pre-commit>=4.6.0",
    "ruff>=0.9.3",
    "sphinx>=8.2.3; python_version >= '3.11'",
    "sphinx-autoapi>=3.8.0",
    "tomli>=2.2.1",
]
test = ["psutil>=7.0.0", "pytest>=8.4.2"]

[tool.pyright]
typeCheckingMode = "standard"
reportImplicitOverride = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "FIX002", # resolving TODOs

    "ERA001", # commented out code

    "D203", # one blank line before class docstring
    "D212", # multi-line docstring start at first line
    "D105", # docstrings in magic methods

    "S101", # assert statements
    "S603", # false-positive subprocess call (https://github.com/astral-sh/ruff/issues/4045)

    "PLR2004", # "magic" values >.>
    "FBT",     # boolean "traps"

    "TD",
    "FIX",
]

[tool.ruff.lint.per-file-ignores]
"docs/*" = ["ALL"]
"tests/*" = ["D", "T", "ANN", "INP", "SLF"]
"scripts/*" = ["T201"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"
