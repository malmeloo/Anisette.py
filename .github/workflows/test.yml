name: Run unit tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  # dl-apk:
  #   runs-on: ubuntu-latest

  #   steps:
  #     - name: Download Apple Music APK file
  #       run: wget -O applemusic.apk https://anisette.dl.mikealmel.ooo/apk

  #     - uses: actions/upload-artifact@v4
  #       with:
  #         name: applemusic
  #         path: applemusic.apk
  #         if-no-files-found: error
  #         retention-days: 1

  versions:
    runs-on: ubuntu-latest

    outputs:
      py-versions: ${{ steps.supported-versions.outputs.py-versions }}

    steps:
      - uses: actions/checkout@v7
      - uses: "./.github/actions/setup"

      - id: supported-versions
        name: Get supported versions
        run: |
          set -e
          echo "py-versions=$(nix shell .#test --command 'python3' ./scripts/supported_py_versions.py)" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest

    needs:
      # - dl-apk
      - versions
    strategy:
      matrix:
        py-version: ${{ fromJson(needs.versions.outputs.py-versions) }}

    steps:
      - uses: actions/checkout@v7
      - uses: "./.github/actions/setup"

      # TODO: select correct python version
      # (need to create multiple nix shells for each version)
      - name: Run unit tests
        run: nix shell .#test --command 'pytest'

  results:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - run: |
          result="${{ needs.test.result }}"
          if [[ $result == "success" || $result == "skipped" ]]; then
            exit 0
          else
            exit 1
          fi
